# =============================================================================
# Insurance Claims RAG - Docker Compose
# =============================================================================
# Usage: docker compose up --build
# =============================================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: insurance-rag-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:-Your_Str0ng_SA_Password!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - insurance-rag-net

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: insurance-rag-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:10000',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - insurance-rag-net

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: insurance-rag-chromadb
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - insurance-rag-net

  ollama:
    image: ollama/ollama:latest
    container_name: insurance-rag-ollama
    environment:
      # Keep model resident so chat doesn't pay a long cold-load each question.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - insurance-rag-net

  ollama-init:
    image: ollama/ollama:latest
    container_name: insurance-rag-ollama-init
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 3; done
        echo "Pulling model $$OLLAMA_MODEL..."
        ollama pull "$$OLLAMA_MODEL"
        echo "Warming model $$OLLAMA_MODEL..."
        curl -s http://ollama:11434/api/generate -d "{\"model\":\"$$OLLAMA_MODEL\",\"prompt\":\"hi\",\"stream\":false,\"options\":{\"num_predict\":1}}" >/dev/null || true
        echo "Ollama model ready."
    networks:
      - insurance-rag-net
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance-rag-backend
    env_file:
      - .env
    environment:
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_PORT: 1433
      SQL_SERVER_DATABASE: ${SQL_SERVER_DATABASE:-InsuranceRagDb}
      SQL_SERVER_USERNAME: ${SQL_SERVER_USERNAME:-sa}
      SQL_SERVER_PASSWORD: ${SQL_SERVER_PASSWORD:-Your_Str0ng_SA_Password!}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-insurance-documents}
      DOCUMENT_PROCESSING_QUEUE_NAME: ${DOCUMENT_PROCESSING_QUEUE_NAME:-document-processing}
      DOCUMENT_PROCESSOR_BASE_URL: ${DOCUMENT_PROCESSOR_BASE_URL:-http://document-processor:80}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      TOP_K: ${TOP_K:-5}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.3}
      SEARCH_MODE: ${SEARCH_MODE:-hybrid}
      ENABLE_RERANK: ${ENABLE_RERANK:-true}
      ENABLE_TRACE_LOGGING: ${ENABLE_TRACE_LOGGING:-true}
      TRACES_DIR: ${TRACES_DIR:-/app/data/traces}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:80}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./eval/error_analysis/traces:/app/data/traces
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
      ollama:
        condition: service_started
      document-processor:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - insurance-rag-net

  document-processor:
    build:
      context: .
      dockerfile: document_processor/Dockerfile
    container_name: insurance-rag-document-processor
    environment:
      AzureWebJobsStorage: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;}
      AzureWebJobsFeatureFlags: EnableWorkerIndexing
      FUNCTIONS_WORKER_RUNTIME: python
      DOCUMENT_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER:-insurance-documents}
      DOCUMENT_PROCESSING_QUEUE_NAME: ${DOCUMENT_PROCESSING_QUEUE_NAME:-document-processing}
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_PORT: 1433
      SQL_SERVER_DATABASE: ${SQL_SERVER_DATABASE:-InsuranceRagDb}
      SQL_SERVER_USERNAME: ${SQL_SERVER_USERNAME:-sa}
      SQL_SERVER_PASSWORD: ${SQL_SERVER_PASSWORD:-Your_Str0ng_SA_Password!}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-insurance_claims_documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      MAX_RETRY_COUNT: ${MAX_RETRY_COUNT:-3}
      PROCESSING_BATCH_SIZE: ${PROCESSING_BATCH_SIZE:-25}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEARCH_MODE: ${SEARCH_MODE:-hybrid}
      ENABLE_RERANK: ${ENABLE_RERANK:-true}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      CANDIDATE_MULTIPLIER: ${CANDIDATE_MULTIPLIER:-4}
      RRF_K: ${RRF_K:-60}
    ports:
      - "7071:80"
    volumes:
      - embedding_cache:/home/site/wwwroot/.cache/huggingface
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
      chromadb:
        condition: service_started
    networks:
      - insurance-rag-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api}
    container_name: insurance-rag-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - insurance-rag-net

volumes:
  sqlserver_data:
  azurite_data:
  chromadb_data:
  ollama_data:
  embedding_cache:

networks:
  insurance-rag-net:
    driver: bridge
