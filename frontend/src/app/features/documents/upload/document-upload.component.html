<div
  class="dropzone"
  [class.dropzone--active]="dragging"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <mat-icon>cloud_upload</mat-icon>
  <h3>Drag & drop claim documents</h3>
  <p>PDF, DOCX, or TXT up to {{ maxSizeMb }} MB</p>
  <label class="browse">
    Browse files
    <input type="file" accept=".pdf,.docx,.txt,application/pdf,text/plain" (change)="onBrowse($event)" hidden />
  </label>

  <form class="chunk-settings" [formGroup]="chunkForm" (click)="$event.stopPropagation()">
    <mat-form-field appearance="outline">
      <mat-label>Chunk size</mat-label>
      <input matInput type="number" formControlName="chunkSize" min="100" max="8000" />
      <mat-hint>Characters per chunk</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Chunk overlap</mat-label>
      <input matInput type="number" formControlName="chunkOverlap" min="0" />
      <mat-hint>Overlap between chunks</mat-hint>
    </mat-form-field>
  </form>

  @if (selectedFile) {
    <div class="selected">
      <strong>{{ selectedFile.name }}</strong>
      <button mat-flat-button color="primary" [disabled]="uploading || chunkForm.invalid" (click)="upload()">
        {{ uploading ? 'Uploading...' : 'Upload' }}
      </button>
    </div>
  }

  @if (uploading) {
    <mat-progress-bar mode="indeterminate" />
    <small>{{ progressLabel }}</small>
  }

  @if (error) {
    <p class="error">{{ error }}</p>
  }
</div>
